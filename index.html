<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Literature Tracker</title>
  <meta name="description" content="Academic literature management PWA" />
  <meta name="theme-color" content="#6366F1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LitTracker" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    /* Polyfill window.storage → localStorage */
    if (!window.storage) {
      var PFX = 'litpwa_';
      window.storage = {
        get: function(key) {
          var v = localStorage.getItem(PFX + key);
          if (v === null) return Promise.reject(new Error('Key not found: ' + key));
          return Promise.resolve({ key: key, value: v, shared: false });
        },
        set: function(key, value) {
          localStorage.setItem(PFX + key, value);
          return Promise.resolve({ key: key, value: value, shared: false });
        },
        delete: function(key) {
          localStorage.removeItem(PFX + key);
          return Promise.resolve({ key: key, deleted: true, shared: false });
        },
        list: function(prefix) {
          var keys = [], pfx = PFX + (prefix || '');
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k.indexOf(pfx) === 0) keys.push(k.slice(PFX.length));
          }
          return Promise.resolve({ keys: keys, prefix: prefix, shared: false });
        }
      };
    }
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      });
    }
  </script>
</body>
</html>
